{% extends 'base.html' %}
{% block title %}Supprimer la question - WIB Challenge{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 text-center">
                    <div class="mb-4">
                        <i class="bi bi-exclamation-triangle text-warning fs-1"></i>
                    </div>
                    <h2 class="h4 fw-bold mb-3">Supprimer cette question ?</h2>
                    <p class="text-muted mb-4">
                        Vous etes sur le point de supprimer la question :<br>
                        <strong>{{ question.title }}</strong>
                    </p>
                    <p class="text-danger small mb-4">
                        Cette action est irreversible.
                    </p>
                    <form method="post" class="d-inline">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger rounded-pill me-2">
                            <i class="bi bi-trash me-1"></i>Supprimer
                        </button>
                    </form>
                    <a href="{% url 'teacher_question_list' %}" class="btn btn-outline-secondary rounded-pill">
                        Annuler
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

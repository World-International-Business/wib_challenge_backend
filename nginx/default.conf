# Configuration du format de logs personnalisé
log_format detailed '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

upstream django {
    server web:8000;
    keepalive 32;
}

server {
    listen 80;

    # Gestion des logs
    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;

    # Configuration de sécurité
    server_tokens off;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # Health check endpoint (sans logs pour éviter le spam)
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Health check détaillé (avec logs)
    location /api/health/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logs spéciaux pour le monitoring
        access_log /var/log/nginx/health.log detailed;
    }

    # Endpoint pour les métriques nginx
    location /nginx-status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.0.0.0/8;  # Docker networks
        deny all;
    }

    # Fichiers statiques avec cache et logs
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        # Logs séparés pour les assets
        access_log /var/log/nginx/static.log;

        # Gestion des erreurs 404 pour les assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # Fichiers media avec protection
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";

        # Logs pour les uploads
        access_log /var/log/nginx/media.log detailed;

        # Sécurité: empêcher l'exécution de scripts
        location ~* \.(php|pl|py|jsp|asp|sh|cgi)$ {
            deny all;
        }
    }
    
    # API endpoints avec monitoring spécial
    location /api/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Configuration pour les API (pas de timeouts agressifs)
        proxy_buffering off;
        proxy_redirect off;

        # Logs détaillés pour les API
        access_log /var/log/nginx/api.log detailed;

        # Gestion des erreurs API
        error_page 502 503 504 /50x.html;
    }

    # Admin avec logs de sécurité
    location /admin/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Logs de sécurité pour l'admin
        access_log /var/log/nginx/admin.log detailed;
    }

    # Toutes les autres routes
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_buffering off;

        # Gestion des erreurs
        error_page 500 502 503 504 /50x.html;
    }

    # Page d'erreur personnalisée
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Blocage des tentatives malveillantes
    location ~ /\. {
        deny all;
        access_log /var/log/nginx/security.log detailed;
    }

    # Blocage des robots malveillants
    location ~* (wp-admin|wp-content|wp-includes|xmlrpc\.php) {
        deny all;
        access_log /var/log/nginx/security.log detailed;
    }
}

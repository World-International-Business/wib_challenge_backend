{% extends "base.html" %}

{% block content %}

<div class="container">
    <h2 class="text-center mb-4">Modifier votre profil</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="row">
            {% for field in form %}
                <div class="col-md-6 mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger">
                            {% for error in field.errors %}
                                <p>{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        <div class="d-grid">
            <button type="submit" class="btn btn-success" style="width: 300px; display: block; margin: 0 auto;">Enregistrer les modifications</button>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {

        // Vérifie si jQuery et Select2 sont bien chargés
        if (typeof $.fn.select2 !== "undefined") {
            $('#id_skills').select2({
                placeholder: "Sélectionnez vos compétences",
                allowClear: true,
                width: '100%'
            });
        } else {
            console.error("Erreur : Select2 n'est pas chargé !");
        }
    });
</script>

{% endblock %}

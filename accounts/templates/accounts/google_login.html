{% extends "base.html" %}  <!-- Utilise ton template principal -->

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h2 class="text-center">Connexion via Google</h2>
                <p class="text-center">Vous êtes sur le point de vous connecter avec votre compte Google.</p>

                <form method="post">
                    {% csrf_token %}
                    <div class="text-center">
                        <button type="submit" class="btn btn-danger">Continuer avec Google</button>
                    </div>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'account_login' %}">Retour à la connexion</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

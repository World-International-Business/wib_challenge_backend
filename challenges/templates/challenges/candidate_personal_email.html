{% autoescape on %}<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f1f5f9;color:#172033;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:600px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
<tr><td style="padding:30px 32px;background:#2563eb;color:#fff;"><div style="font-size:13px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;">WIB Challenge</div><div style="margin-top:12px;font-size:25px;line-height:1.2;font-weight:bold;">{{ subject }}</div></td></tr>
<tr><td style="padding:36px 32px 30px;"><h1 style="margin:0 0 16px;font-size:27px;line-height:1.25;">Bonjour {{ first_name }},</h1><div style="font-size:16px;line-height:1.7;color:#475569;white-space:pre-line;">{{ message }}</div></td></tr>
<tr><td style="padding:20px 32px;background:#f8fafc;border-top:1px solid #e2e8f0;text-align:center;"><p style="margin:0;font-size:12px;color:#94a3b8;">Message envoyé par l'équipe WIB Challenge.</p></td></tr>
</table><p style="margin:18px 16px 0;font-size:11px;color:#94a3b8;">© 2026 WIB Challenge</p>
</td></tr></table>
</body></html>{% endautoescape %}

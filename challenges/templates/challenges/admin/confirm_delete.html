{% extends 'base.html' %}

{% block title %}Supprimer - Admin WIB{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 text-center">
                    <div class="icon-circle-sm bg-danger bg-opacity-10 text-danger mx-auto mb-3" style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;">
                        <i class="bi bi-exclamation-triangle"></i>
                    </div>
                    <h4 class="fw-bold mb-3">Confirmer la suppression</h4>
                    <p class="text-muted mb-4">
                        Voulez-vous vraiment supprimer <strong>{{ object }}</strong> ?<br>
                        Cette action est irréversible.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-2">
                            <button type="submit" class="btn btn-danger rounded-pill">Supprimer</button>
                            <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-outline-secondary rounded-pill">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

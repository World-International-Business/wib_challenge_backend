services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wib_challenge}
      POSTGRES_USER: ${POSTGRES_USER:-wib_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: ./entrypoint.sh
    environment:
      DEBUG: ${DEBUG:-False}
      DJANGO_SETTINGS_MODULE: wib_challenge.settings
      DATABASE_URL: postgresql://${POSTGRES_USER:-wib_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wib_challenge}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL must be set}
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EDUCATION_SCHOOL_NAME: ${EDUCATION_SCHOOL_NAME:-}
      EDUCATION_SCHOOL_CODE: ${EDUCATION_SCHOOL_CODE:-}
      EDUCATION_ACADEMIC_YEAR: ${EDUCATION_ACADEMIC_YEAR:-}
      EDUCATION_CLASSES: ${EDUCATION_CLASSES:-}
      EDUCATION_SUBJECTS: ${EDUCATION_SUBJECTS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

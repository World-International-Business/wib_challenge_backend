services:
  web:
    build: .
    command: ./entrypoint.sh
    environment:
      DEBUG: ${DEBUG:-False}
      DJANGO_SETTINGS_MODULE: wib_challenge.settings
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL must be set}
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      EDUCATION_SCHOOL_NAME: ${EDUCATION_SCHOOL_NAME:-}
      EDUCATION_SCHOOL_CODE: ${EDUCATION_SCHOOL_CODE:-}
      EDUCATION_ACADEMIC_YEAR: ${EDUCATION_ACADEMIC_YEAR:-}
      EDUCATION_CLASSES: ${EDUCATION_CLASSES:-}
      EDUCATION_SUBJECTS: ${EDUCATION_SUBJECTS:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
    volumes:
      - static_volume:/app/collected_static
      - media_volume:/app/media
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:

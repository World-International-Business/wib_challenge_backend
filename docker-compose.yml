version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: wib_challenge
      POSTGRES_USER: wib_user
      POSTGRES_PASSWORD: wib_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wib_user -d wib_challenge"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: ./entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/collected_static
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - DATABASE_URL=postgresql://wib_user:wib_password@db:5432/wib_challenge
      - SECRET_KEY=${SECRET_KEY:-change_this_in_production}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - EMAIL_PROVIDER=smtp
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM:-noreply@wib-challenge.com}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - static_volume:/app/staticfiles
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume: